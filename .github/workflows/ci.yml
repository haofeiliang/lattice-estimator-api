name: CI

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --all-groups
      - run: uv run --frozen ruff check src tests tools
      - run: uv run --frozen ruff format --check src tests tools
      - name: Run unit tests on pull requests
        if: github.event_name == 'pull_request'
        run: uv run --frozen pytest tests/unit

  image:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Test with real Sage
        run: docker build --target test -t lattice-estimator-api:test .
      - name: Build runtime image
        run: docker build --target runtime -t lattice-estimator-api:dev .
      - name: Smoke test runtime image
        shell: bash
        run: |
          docker run -d --name lattice-estimator-api -p 127.0.0.1:8000:8000 lattice-estimator-api:dev
          trap 'docker logs lattice-estimator-api; docker rm -f lattice-estimator-api' EXIT
          for _ in {1..30}; do
            curl --fail http://127.0.0.1:8000/healthz && exit 0
            sleep 1
          done
          exit 1

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [unit, image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: image-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require the release commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Determine whether this is the newest stable release
        id: release
        shell: bash
        run: |
          update_latest=false
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            while IFS= read -r tag; do
              [[ "$tag" == *-* ]] && continue
              [[ "$GITHUB_REF_NAME" == "$tag" ]] && update_latest=true
              break
            done < <(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname)
          fi
          echo "update_latest=$update_latest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ steps.release.outputs.update_latest == 'true' }}
            type=sha,format=long
      - name: Build and publish runtime image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify latest points to this stable release
        if: steps.release.outputs.update_latest == 'true'
        env:
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}' \
            | jq --exit-status --arg digest "$EXPECTED_DIGEST" '.digest == $digest'
