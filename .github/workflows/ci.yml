name: CI

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv lock --check
      - name: Check exported runtime dependencies
        shell: bash
        run: |
          uv export --frozen --no-dev --no-emit-project \
            --no-emit-package lattice-estimator --no-header \
            --format requirements.txt --output-file /tmp/requirements.lock
          tail -n +4 requirements.lock | diff --unified - /tmp/requirements.lock
      - run: uv sync --frozen --all-groups
      - run: uv run --frozen python tools/check_dependency_pins.py
      - run: uv run --frozen ruff check src tests tools
      - run: uv run --frozen ruff format --check src tests tools
      - run: uv run --frozen pytest tests/unit

  sage-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Test with real Sage and lattice-estimator
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          platforms: linux/amd64
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,mode=max,scope=api-image

  release-image:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [unit, sage-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: image-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require the release commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Determine whether this is the newest stable release
        id: release
        shell: bash
        run: |
          update_latest=false
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            while IFS= read -r tag; do
              [[ "$tag" == *-* ]] && continue
              [[ "$GITHUB_REF_NAME" == "$tag" ]] && update_latest=true
              break
            done < <(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname)
          fi
          echo "update_latest=$update_latest" >> "$GITHUB_OUTPUT"
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ steps.release.outputs.update_latest == 'true' }}
            type=sha,format=long
      - uses: docker/setup-buildx-action@v4
      - name: Build the runtime image once
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            lattice-estimator-api:release
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,mode=max,scope=api-image
      - name: Smoke test the built image
        shell: bash
        run: |
          docker run -d --name lattice-estimator-api \
            -p 127.0.0.1:8000:8000 lattice-estimator-api:release
          trap 'docker logs lattice-estimator-api; docker rm -f lattice-estimator-api' EXIT
          for _ in {1..30}; do
            curl --fail http://127.0.0.1:8000/healthz && exit 0
            sleep 1
          done
          exit 1
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && docker push "$tag"
          done <<< "$IMAGE_TAGS"
      - name: Verify latest points to this stable release
        if: steps.release.outputs.update_latest == 'true'
        shell: bash
        run: |
          release_digest=$(docker buildx imagetools inspect "$IMAGE:${GITHUB_REF_NAME#v}" --format '{{json .Manifest}}' | jq -r '.digest')
          docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}' \
            | jq --exit-status --arg digest "$release_digest" '.digest == $digest'
